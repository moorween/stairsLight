[platformio]
default_envs = esp32-usb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DSETT_NO_DB
    -DSETT_NO_TABLE
    -DMQTT_SOCKET_TIMEOUT=2
lib_deps =
    https://github.com/moorween/subjectLab.git#v1.1.0
    dawidchyrzynski/home-assistant-integration@2.1.0
    knolleary/PubSubClient@2.8
    gyverlibs/Settings@1.3.13
    gyverlibs/BSON@2.2.4
    gyverlibs/StringUtils@1.5.3
    gyverlibs/GyverHTTP@1.0.30
    gyverlibs/Stamp@1.4.4
    gyverlibs/Table@1.3.4
    gyverlibs/GTL@1.3.5
    gyverlibs/GyverDB@1.3.2
    gyverlibs/FOR_MACRO@1.0.0
    gyverlibs/StreamIO@1.0.5

[env:esp32-usb]
upload_protocol = esptool

[env:esp32-ota]
upload_protocol = espota
upload_port = ${sysenv.STAIRS_OTA_HOST}
upload_flags =
    --auth=${sysenv.STAIRS_OTA_PASSWORD}
